# Purity Beans — Autonomous Daily Pipeline
# Canonical slots: 06:00 IST generate, 10:00 IST morning, 22:00 IST evening.
# Git is authoritative persistent state. Actions cache is intentionally not used for output state.

name: Purity Beans Daily Pipeline

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 4 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Manual slot to execute — never infer from wall-clock time'
        required: true
        type: choice
        options:
          - generate
          - morning
          - evening
      day_number:
        description: 'Override day number (leave blank for auto)'
        required: false
        default: ''
      force_run:
        description: 'Force run even if already ran today'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ENABLE_TIMED_SLOTS: "true"
  FORCE_SLOT: ${{ github.event.schedule == '30 0 * * *' && 'generate' || (github.event.schedule == '30 4 * * *' && 'morning' || (github.event.schedule == '30 16 * * *' && 'evening' || github.event.inputs.slot || '')) }}
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: purity-beans-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Daily Content Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (disk-safe)
        run: |
          set -euo pipefail
          # sentence-transformers is deliberately excluded from production requirements.
          # Its dependency chain installs CUDA-enabled torch and can exhaust the runner.
          if grep -Eiq '^[[:space:]]*sentence-transformers([<>=!~]|[[:space:]]|$)' requirements.txt; then
            echo "::error::sentence-transformers must not be installed in CI; use the TF-IDF/ngram fallback instead."
            exit 1
          fi
          python -m pip install --no-cache-dir -r requirements.txt
          python - <<'PY'
          import importlib.util, sys
          forbidden = ("sentence_transformers", "torch")
          found = [name for name in forbidden if importlib.util.find_spec(name)]
          if found:
              print(f"::error::Forbidden heavyweight ML packages present after dependency install: {', '.join(found)}")
              sys.exit(1)
          print("::notice::Dependency install verified — no sentence-transformers/torch CUDA chain present.")
          PY

      - name: Install rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation
          fc-list | grep -ci dejavu || (echo "DejaVu missing after install" && exit 1)

      - name: Ensure output directory
        run: mkdir -p output

      - name: Mark generate start
        if: ${{ env.FORCE_SLOT == 'generate' }}
        run: date +%s > .generate_started_epoch

      - name: Clear run lock (if force_run)
        if: ${{ github.event.inputs.force_run == 'true' }}
        run: python -m content_generator.scheduler.daily --unlock

      - name: Verify render, measurement, governance and workflow contracts
        run: |
          pytest -q tests/

      - name: Meta token soft-check (generate)
        if: ${{ success() && env.FORCE_SLOT == 'generate' }}
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          account = (os.environ.get("INSTAGRAM_ACCOUNT_ID") or "").strip()
          token = (os.environ.get("INSTAGRAM_ACCESS_TOKEN") or "").strip()
          if not account or not token:
              print("::warning::Instagram credentials unavailable; generate continues; publish slots fail closed.")
              raise SystemExit(0)
          url = f"https://graph.facebook.com/v24.0/{urllib.parse.quote(account, safe='')}?fields=id"
          try:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=15) as r: payload = json.load(r)
              print("::notice::Meta token responds." if str(payload.get("id")) == account else f"::warning::Unexpected Meta account id {payload.get('id')} (expected {account}); publish slots will preflight again.")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"::warning::Meta token check failed (HTTP {exc.code} {exc.reason}): {body}; generate continues.")
          except Exception as exc:
              print(f"::warning::Meta token check failed ({type(exc).__name__}: {exc}); generate continues.")
          PY

      - name: Verify Meta publishing access
        if: ${{ success() && env.FORCE_SLOT != 'generate' }}
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          account = (os.environ.get("INSTAGRAM_ACCOUNT_ID") or "").strip()
          token = (os.environ.get("INSTAGRAM_ACCESS_TOKEN") or "").strip()
          if not account or not token:
              print("::error::Instagram publishing credentials (INSTAGRAM_ACCOUNT_ID / INSTAGRAM_ACCESS_TOKEN) are missing.")
              sys.exit(1)
          url = f"https://graph.facebook.com/v24.0/{urllib.parse.quote(account, safe='')}?fields=id"
          try:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=20) as r: payload = json.load(r)
              if str(payload.get("id")) != account:
                  raise RuntimeError(f"Unexpected account id returned: {payload.get('id')} (expected {account})")
              print("::notice::Meta publishing preflight passed.")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"::error::Meta publishing preflight failed (HTTP {exc.code} {exc.reason}): {body}")
              sys.exit(1)
          except Exception as exc:
              print(f"::error::Meta publishing preflight failed: {type(exc).__name__} - {exc}")
              sys.exit(1)
          PY

      - name: Run autonomous pipeline
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          FOUNDER_PHONE: ${{ secrets.FOUNDER_PHONE }}
          AISENSY_API_KEY: ${{ secrets.AISENSY_API_KEY }}
          AISENSY_CAMPAIGN_NAME: ${{ secrets.AISENSY_CAMPAIGN_NAME }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          LI_API_ACCESS: ${{ secrets.LI_API_ACCESS }}
          LI_AUTHOR_URN: ${{ secrets.LI_AUTHOR_URN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_PRODUCT_ID: ${{ secrets.IG_PRODUCT_ID }}
          IG_CATALOG_ID: ${{ secrets.IG_CATALOG_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FAL_KEY: ${{ secrets.FLUX_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NURTURE_FROM_EMAIL: ${{ secrets.NURTURE_FROM_EMAIL }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          SHOPIFY_BLOG_ENABLED: "true"
          # Extended content is founder-policy controlled, never a workflow override.
          # Source: founder_policies.yaml -> content.enable_extended_content.
          WEBSITE_URL: https://p3online.in
          ENABLE_EDITORIAL_REVIEW: "true"
          ENABLE_WEEKLY_SUMMARY: "true"
          ENABLE_USAGE_LOG: "false"
          PYTHONIOENCODING: utf-8
          OVERRIDE_DAY_NUMBER: ${{ github.event.inputs.day_number }}
        run: |
          set -o pipefail
          if [ -n "$OVERRIDE_DAY_NUMBER" ]; then python -m content_generator.scheduler.daily --now --day "$OVERRIDE_DAY_NUMBER" | tee run_result.json; else python -m content_generator.scheduler.daily --now | tee run_result.json; fi

      - name: Verify slot result
        if: success()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NURTURE_FROM_EMAIL: ${{ secrets.NURTURE_FROM_EMAIL }}
          FORCE_SLOT: ${{ env.FORCE_SLOT }}
        run: |
          python - <<'PY'
          import datetime, json, os, re, sys, urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo
          slot=os.environ.get("FORCE_SLOT","").strip()
          if slot not in {"generate","morning","evening"}: print("::error::No explicit execution slot; refusing wall-clock guessing."); sys.exit(1)
          def alert(msg):
              print(f"::error::{msg}")
              try:
                  from content_generator.scheduler.watchdog import alert_failure
                  alert_failure(msg)
              except Exception as exc:
                  print(f"::warning::alert dispatch failed: {exc}")
                  hook=os.environ.get("ALERT_WEBHOOK_URL")
                  if hook:
                      try: urllib.request.urlopen(urllib.request.Request(hook,data=json.dumps({"text":msg}).encode(),headers={"Content-Type":"application/json"}),timeout=15)
                      except Exception: pass
          if slot=="generate":
              ist_today = datetime.datetime.now(ZoneInfo("Asia/Kolkata")).date()
              expected = Path(f"output/content_{ist_today.isoformat()}.json")
              if not expected.exists():
                  alert(f"GENERATE completed without today's persisted content file: {expected}")
                  sys.exit(1)
              try:
                  started = int(Path(".generate_started_epoch").read_text().strip())
              except Exception:
                  alert("GENERATE verification missing start marker; refusing stale-content success.")
                  sys.exit(1)
              if int(expected.stat().st_mtime) < started:
                  alert(f"GENERATE found today's content file, but it predates this run: {expected}")
                  sys.exit(1)
              try:
                  payload=json.loads(expected.read_text(encoding="utf-8"))
              except Exception as exc:
                  alert(f"GENERATE persisted today's content but it is not valid JSON: {type(exc).__name__}")
                  sys.exit(1)
              if not isinstance(payload, dict) or payload.get("day_number") in (None, 0):
                  alert("GENERATE persisted today's file without a valid day_number.")
                  sys.exit(1)
              generation_id = str(payload.get("generation_id") or "").strip()
              if not generation_id:
                  alert("GENERATE persisted today's file without generation_id; refusing ambiguous state.")
                  sys.exit(1)
              from content_generator.core.editorial_engine import approved_assets
              approved = approved_assets(payload)
              feed_ok = "carousel" in approved or "instagram_post" in approved
              reel_ok = any(k in approved for k in ("growth_reel", "reel_1", "reel_2"))
              if not feed_ok or not reel_ok:
                  alert(
                      "GENERATE saved content the morning and evening slots cannot publish: "
                      f"approved={sorted(approved)}"
                  )
                  sys.exit(1)
              print(f"::notice::GENERATE verified — {expected} | day={payload.get('day_number')} | generation_id={generation_id}; no publication expected at 06:00 IST.")
              sys.exit(0)
          raw=Path("run_result.json").read_text(encoding="utf-8",errors="ignore")
          m=re.search(r"\{.*\}\s*$",raw,re.S)
          if not m: alert(f"{slot.upper()} produced no parseable publish result."); sys.exit(1)
          try: result=json.loads(m.group(0))
          except json.JSONDecodeError as exc: alert(f"{slot.upper()} returned invalid JSON: {exc}"); sys.exit(1)
          from content_generator.core.publish_contract import evaluate,format_report
          verdict=evaluate(result); print(format_report(result))
          if verdict["status"]=="missing": alert(f"{slot.upper()} publish contract missing."); sys.exit(1)
          if verdict["ok"]: print(f"::notice::{verdict['status']}: {verdict['detail']}"); sys.exit(0)
          alert(verdict["detail"]); sys.exit(1)
          PY

      - name: Upload run diagnostics (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: purity-beans-run-${{ github.run_number }}
          path: |
            run_result.json
            output/reports/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

      - name: Persist validated state to Git
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "Purity Beans Engine"
          git config user.email "engine@puritybeans.auto"
          git pull --rebase --autostash
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) run #${{ github.run_number }}" >> .last_run
          git add .last_run
          git add -f output/learning/ 2>/dev/null || true
          python - <<'PRUNE'
          import datetime, glob, os, re
          from zoneinfo import ZoneInfo
          cutoff = datetime.datetime.now(ZoneInfo("Asia/Kolkata")).date() - datetime.timedelta(days=7)
          removed = 0
          for path in glob.glob("output/creative/*"):
              m = re.search(r"(\d{4})-(\d{2})-(\d{2})", os.path.basename(path))
              if not m:
                  continue
              try:
                  stamped = datetime.date(*(int(g) for g in m.groups()))
              except ValueError:
                  continue
              if stamped < cutoff:
                  os.remove(path)
                  removed += 1
          print(f"pruned {removed} creative files older than {cutoff}")
          PRUNE
          git add -f output/creative/ 2>/dev/null || true
          ist_date=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          git add -f "output/content_${ist_date}.json" 2>/dev/null || true
          git add -f "output/blog_${ist_date}.json" "output/blog_${ist_date}.md" "output/blog_${ist_date}.html" "output/blog_${ist_date}.llms.txt" 2>/dev/null || true
          git add -f output/reports/ 2>/dev/null || true
          git add -f output/.running* 2>/dev/null || true
          if ! git diff --staged --quiet; then git commit -m "chore: run ${{ github.run_number }} — validated content + learning data [skip ci]"; fi
          if ! git push; then
            echo "push rejected — rebasing on the remote and retrying"
            git pull --rebase --autostash
            git push || { echo "::error::Could not push validated run state; publish slots cannot load persisted content."; exit 1; }
          fi

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NURTURE_FROM_EMAIL: ${{ secrets.NURTURE_FROM_EMAIL }}
        run: |
          python - <<'PY'
          import os
          msg = (
              "PURITY BEANS PIPELINE FAILED\n"
              f"Run: {os.environ.get('GITHUB_RUN_NUMBER', '')}\n"
              f"Logs: {os.environ.get('GITHUB_SERVER_URL', '')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID', '')}"
          )
          try:
              from content_generator.scheduler.watchdog import alert_failure
              alert_failure(msg)
          except Exception as exc:
              print(f"alert dispatch failed: {exc}")
              raise
          print(msg)
          PY
          echo "Pipeline failed — check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
