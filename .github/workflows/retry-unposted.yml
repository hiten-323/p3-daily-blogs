# Schedule re-registration touch: 2026-10-15 (off-peak minutes; GitHub drops many :00/:30 schedule events)
name: Retry unposted (self-resuming)

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Backfill a past IST content date (YYYY-MM-DD); blank = today'
        required: false
        default: ''

concurrency:
  group: purity-beans-retry
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  models: read

jobs:
  recover:
    name: Regenerate and publish anything not yet posted today
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main after concurrency queue
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation ffmpeg

      - name: Resolve Meta publishing account
        id: meta_preflight
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          META_TOKEN_MODE: soft
        run: python -m content_generator.ops.meta_token_health

      - name: Retry unposted platforms/types
        env:
          QUALITY_LADDER_MAX: '8'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ENABLE_TIMED_SLOTS: "true"
          WEBSITE_URL: https://p3online.in
          INSTAGRAM_ACCOUNT_ID: ${{ steps.meta_preflight.outputs.instagram_account_id || secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LI_API_ACCESS: ${{ secrets.LI_API_ACCESS }}
          LI_AUTHOR_URN: ${{ secrets.LI_AUTHOR_URN }}
          LI_CLIENT_ID: ${{ secrets.LI_CLIENT_ID }}
          LI_CLIENT_SECRET: ${{ secrets.LI_CLIENT_SECRET }}
          LI_REFRESH_TOKEN: ${{ secrets.LI_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          BLOG_ENABLED: "false"
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NURTURE_FROM_EMAIL: ${{ secrets.NURTURE_FROM_EMAIL }}
          PYTHONIOENCODING: utf-8
          RETRY_DATE: ${{ github.event.inputs.date || '' }}
        run: python -m content_generator.scheduler.retry_unposted

      - name: Persist publishing ledger and logs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Purity Beans Engine"
          git config user.email "engine@puritybeans.auto"
          # Keep only what this step persists; discard other generated artifacts (mp4s,
          # published_posts.json) so --autostash can't conflict and lose the ledger (exit 128).
          PERSIST=$(mktemp -d)
          cp -f output/content_*.json output/publish_log.json output/learning/publish_diagnostics.json "$PERSIST"/ 2>/dev/null || true
          python -m content_generator.ops.ledger_sync save
          git reset -q --hard HEAD && git clean -qfd output/creative 2>/dev/null || true
          git pull --rebase
          python -m content_generator.ops.ledger_sync restore
          for f in "$PERSIST"/content_*.json "$PERSIST"/publish_log.json; do [ -f "$f" ] && cp -f "$f" output/; done
          [ -f "$PERSIST/publish_diagnostics.json" ] && cp -f "$PERSIST/publish_diagnostics.json" output/learning/ || true
          git add -f output/learning/publishing_ledger.json output/content_*.json 2>/dev/null || true
          git add -f output/publish_log.json output/learning/publish_diagnostics.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: retry-unposted ledger + regenerated pieces [skip ci]"
            for i in 1 2 3; do
              git push && break
              echo "push rejected — merging ledger with remote and retrying ($i)"
              git reset --soft HEAD~1
              python -m content_generator.ops.ledger_sync save
              git reset -q --hard HEAD
              git pull --rebase
              python -m content_generator.ops.ledger_sync restore
              git add -f output/learning/publishing_ledger.json
              git commit -m "chore: retry-unposted ledger + regenerated pieces [skip ci]"
              [ "$i" = 3 ] && { git push || { echo "::error::Could not push ledger"; exit 1; }; }
            done
          fi

      - name: Self-resume if today still has unposted pieces (cron backstop)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          HOUR_IST=$(TZ=Asia/Kolkata date +%H)
          if [ "$HOUR_IST" -lt 7 ] || [ "$HOUR_IST" -ge 23 ]; then echo "Outside 07-23 IST; not chaining."; exit 0; fi
          PENDING=$(python - <<'PY'
          import json, datetime, zoneinfo
          today = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Kolkata")).date().isoformat()
          try:
              data = json.load(open("output/learning/publishing_ledger.json"))
          except Exception:
              print(0); raise SystemExit
          n = 0
          def walk(o):
              global n
              if isinstance(o, dict):
                  for k, v in o.items():
                      if isinstance(k, str) and k.startswith(today + "|") and isinstance(v, dict):
                          if v.get("status") != "VERIFIED_LIVE":
                              n += 1
                      else:
                          walk(v)
          walk(data)
          print(n)
          PY
          )
          echo "Unposted ledger entries for today: ${PENDING:-0}"
          if [ "${PENDING:-0}" -gt 0 ]; then
            sleep 240
            gh workflow run retry-unposted.yml -R "$GITHUB_REPOSITORY" --ref main || echo "::warning::self-dispatch failed"
          fi
