name: Growth OS Health

on:
  schedule:
    # 05:40 IST — before the 06:00 generation run.
    - cron: '10 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'content_generator/ops/growth_health.py'
      - 'tests/test_growth_health.py'
      - 'config/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  health:
    name: Growth OS production health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit test health checks
        run: python -m pytest tests/test_growth_health.py -q

      - name: Production health check
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python -m content_generator.ops.growth_health
