name: Instagram Token Health

on:
  schedule:
    # 05:45 IST = 00:15 UTC, 15 minutes before the generate slot.
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-health:
    name: Verify Instagram Graph token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Instagram token
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          account_id = os.environ.get("INSTAGRAM_ACCOUNT_ID")
          token = os.environ.get("INSTAGRAM_ACCESS_TOKEN")
          webhook = os.environ.get("ALERT_WEBHOOK_URL")

          def alert(message: str) -> None:
              print(f"::error::{message}")
              if not webhook:
                  return
              try:
                  req = urllib.request.Request(
                      webhook,
                      data=json.dumps({"text": message}).encode(),
                      headers={"Content-Type": "application/json"},
                  )
                  urllib.request.urlopen(req, timeout=10).read()
              except Exception as exc:
                  print(f"::warning::alert webhook failed: {exc}")

          # Missing credentials are an infrastructure failure, not a successful
          # health check. The publisher is fail-closed for the same reason.
          if not account_id or not token:
              alert(
                  "PURITY BEANS: Instagram token health FAILED — "
                  "INSTAGRAM_ACCOUNT_ID or INSTAGRAM_ACCESS_TOKEN is not configured."
              )
              sys.exit(1)

          account = urllib.parse.quote(account_id, safe="")
          url = f"https://graph.facebook.com/v24.0/{account}?fields=id"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "PurityBeans/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("id"):
                  print("::notice::Instagram Graph token is responding")
                  sys.exit(0)
              alert("PURITY BEANS: Instagram Graph token check returned no account id. Verify the token and account configuration.")
              sys.exit(1)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              if exc.code in (401, 403):
                  alert(
                      f"PURITY BEANS: Instagram Graph authentication failed with HTTP {exc.code}. "
                      "Renew/check INSTAGRAM_ACCESS_TOKEN before the next publishing run."
                  )
              else:
                  alert(f"PURITY BEANS: Instagram Graph token health returned HTTP {exc.code}. Check the Meta API response.")
              print(f"Graph response body (sanitized status only): HTTP {exc.code}; payload length={len(body)}")
              sys.exit(1)
          except Exception as exc:
              alert(f"PURITY BEANS: Instagram Graph token health check failed before publishing: {type(exc).__name__}")
              sys.exit(1)
          PY
