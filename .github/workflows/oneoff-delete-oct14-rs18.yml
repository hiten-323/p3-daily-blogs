name: One-off delete Oct 14 Rs18 posts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exactly two approved posts (Hiten-approved 2026-10-15)
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TH_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set +e
          echo "== Threads 18117202972797060 (Dedt4hom08T)"
          curl -s -w "\nHTTP %{http_code}\n" -X DELETE "https://graph.threads.net/v1.0/18117202972797060?access_token=${TH_TOKEN}" | sed "s/${TH_TOKEN}/***/g"
          echo "== Instagram 18434637682194969 (DeeLpQcGIEM)"
          curl -s -w "\nHTTP %{http_code}\n" -X DELETE "https://graph.facebook.com/v21.0/18434637682194969?access_token=${IG_TOKEN}" | sed "s/${IG_TOKEN}/***/g"
          echo "== verify"
          curl -s -o /dev/null -w "threads GET HTTP %{http_code}\n" "https://graph.threads.net/v1.0/18117202972797060?fields=id&access_token=${TH_TOKEN}"
          curl -s -o /dev/null -w "ig GET HTTP %{http_code}\n" "https://graph.facebook.com/v21.0/18434637682194969?fields=id&access_token=${IG_TOKEN}"
