# ─────────────────────────────────────────────────────────────────────────────
# FOUNDER POLICIES — the founder edits THIS file, never the prompts or code.
#
# Every Director / pipeline step reads these before acting. Change a value and
# the whole engine adapts next run. Missing keys fall back to safe defaults.
#
# VERSIONING: bump `version` and describe `changes` whenever you edit policy.
# Every published asset records its policy_version, so later you can see which
# policy produced which results.
# ─────────────────────────────────────────────────────────────────────────────

version:
  number: "1.2"
  effective_date: "2026-08-13"
  author: "Founder"
  changes:
    - "Initial domain-structured policy"
    - "Target KPI: followers (IGNITION stage)"
    - "Auto-publish enabled across all platforms"
    - "Editorial minimum aligned to the constitutional 8.0 threshold"
    - "enable_extended_content is a founder policy decision (not a workflow override)"

business:
  objective: growth            # growth | revenue | balance
  target_kpi: followers        # followers | engagement | revenue

content:
  auto_publish: true           # false = generate + save only (dry run)
  reels_per_day: 1
  blogs_per_week: 7
  require_real_jar: true       # product images use real jar photos, never AI-invented
  # Extended assets (reel_2, blog, stories, yt_short). Increases free-tier TPM load.
  # Change here — do not hardcode in the workflow. Env ENABLE_EXTENDED_CONTENT is
  # an emergency override only.
  enable_extended_content: true
  # ALGORITHM CONSISTENCY (Kallaway): the algorithm rewards a NARROW, consistent
  # avatar + topic lane — it builds a strong "fit score" and pushes you to the
  # right non-followers. Mixing avatars/topics confuses it and you flop. Keep
  # these tight; vary the ANGLE, never the avatar or lane.
  core_avatar: "Urban Indian coffee drinker, 22-40, who cares about what they consume"
  core_topic_lane: "The truth about instant coffee quality and how to drink better coffee"

brand:
  premium: true
  aggressive_sales: false       # false = value-first; true = harder CTAs
  educational: true
  # CREATOR DNA (heyDominik): a stranger scrolls past generic. State who we are,
  # who we're for, and why to trust us — injected so content isn't faceless.
  creator_dna: "We are Purity Beans. We make 100% pure instant coffee for Indians who are done being fooled by chicory-filled 'coffee'. Listen to us because we print exactly what's inside — and dare you to read any other label."

marketing:
  priority_segments:            # who to speak to, in order
    - general
    - corporate
    - hotels
  active_campaign_override: ""  # e.g. "Festival Gifting" in Q4; blank = always-on

quality:
  minimum_score: 8.0            # constitutional editorial pass threshold
  legal_risk_threshold: 0.25    # 0 strict … 1 lax
  plagiarism_threshold: 0

publishing:
  instagram: true
  facebook: true
  linkedin: true
  youtube: true
  threads: true
  max_daily_posts:
    instagram: 3
    facebook: 2
    linkedin: 1
    youtube: 1
    threads: 1

experiments:
  enabled: true
  max_parallel: 2
